name: Tarama

on:
  schedule:
    - cron: "17 * * * *"        # her saat, 17. dakikada (UTC)
  workflow_dispatch:             # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths: [overrides.yaml, config.yaml, site/index.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Testler
        run: pip install pytest==8.3.3 && python -m pytest -q tests

      - name: Amazon taraması
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.main

      - name: Veriyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Tarama $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp data/site.json _site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Ayrıştırılamayan sayfalar (hata ayıklama)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

  yayin:
    needs: tarama
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
