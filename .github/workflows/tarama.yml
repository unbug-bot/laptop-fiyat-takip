name: Site

# Mac'in gönderdiği veriyle siteyi yayınlar. Amazon'a istek atmaz.
on:
  push:
    branches: [main]
    paths: [data/site.json, site/index.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  yayin:
    runs-on: ubuntu-latest
    concurrency:
      group: pages                 # Fiyat iş akışıyla aynı grup: iki yayın aynı anda olmaz
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp data/site.json _site/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
