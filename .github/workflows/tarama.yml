name: Site

# Tarama artık Mac'te yapılıyor. Bu iş akışı yalnızca Mac'in gönderdiği veriyle siteyi yayınlar.
on:
  push:
    branches: [main]
    paths: [data/site.json, site/index.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp data/site.json _site/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
