name: Fiyat

# Saatlik fiyat kontrolü. KEŞİF YAPMAZ: arama sayfası açmaz, yalnızca onaylı ürünlerin sayfasını
# ASIN'den açar. Veritabanına (data/db.json) ve data/site.json'a yazmaz; onların sahibi Mac'tir.
# Yalnızca data/gozlem/ altına yeni bir dosya ve data/github_durum.json yazar; Mac bunları her turda işler.
on:
  schedule:
    - cron: "47 * * * *"          # her saat 47. dakikada (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  fiyat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tarayıcı oturumunu geri yükle
        uses: actions/cache/restore@v4
        with:
          path: state/chrome-profil-github
          key: chrome-github-${{ github.run_id }}
          restore-keys: chrome-github-

      - name: Fiyat kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python -u -m scraper.github_fiyat

      - name: Tarayıcı oturumunu sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/chrome-profil-github
          key: chrome-github-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Gözlemleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gozlem data/github_durum.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "GitHub fiyat kontrolü $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Ayrıştırılamayan sayfalar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

  yayin:
    needs: fiyat
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
