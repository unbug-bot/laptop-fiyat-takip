# Ayarlar yalnızca bu dosyadan okunur (Mac'teki program klasörü). Her tur başında yeniden okunur.
# Filtreler. Tüm kurallar katı uygulanır; doğrulanamayan özellik "beklemede" durumuna düşer.
max_price_tl: 140000          # Bu fiyatın üstündeki ürün sitede görünmez, bildirim almaz; takibi sürer
alert_drop_pct: 10            # Takip süresindeki en düşük fiyatın en az bu kadar altı -> Telegram
min_screen_inch: 17.0
min_refresh_hz: 144
min_ram_gb: 16
min_resolution: [2560, 1440]  # QHD ve üstü

gpu_whitelist:
  - rtx 5060
  - rtx 5070
  - rtx 5070 ti
  - rtx 5080
  - rtx 5090
  - rtx 4080
  - rtx 4090
  - rx 7600m xt
  - rx 7700s
  - rx 7800m
  - rx 7900m

cpu_whitelist:
  - core ultra 7 255hx
  - core ultra 9 275hx
  - core ultra 9 285hx
  - core ultra 9 290hx          # 290HX Plus
  - core i9-14900hx
  - ryzen 9 8940hx
  - ryzen 9 8945hx
  - ryzen 9 7945hx
  - ryzen 9 7945hx3d
  - ryzen 9 9955hx
  - ryzen 9 9955hx3d

# Anahtar kelime aramaları: gpu_whitelist ve cpu_whitelist'teki her model için OTOMATİK üretilir
# ("rtx 5070 laptop", "rtx5070", "9955hx3d", "275hx" ...). Buraya yalnızca ek genel sorgular yazılır.
search_queries:
  - oyuncu laptop 17 inç
  - oyuncu laptop 18 inç
  - gaming laptop 18
search_pages: 5

# Kategori taraması: "Dizüstü Bilgisayarlar" kategorisi fiyat aralıklarına bölünerek gezilir.
# Her tur bir parça ilerler, kaldığı yeri hatırlar; döngü bitince baştan başlar.
sweep_min_tl: 85000             # bu fiyatın altı taranmaz
sweep_order: artan              # artan: ucuzdan pahalıya | azalan: pahalıdan ucuza
sweep_max_factor: 1.25          # üst sınır = max_price_tl x bu katsayı (sınır yakınındakilerin geçmişi için)
sweep_pages_per_run: 30         # her turda kategori taramasına ayrılan sayfa
keyword_pages_per_run: 15       # her turda anahtar kelime aramalarına ayrılan sayfa
amazon_result_cap: 480          # Amazon'un bir sorguda gösterdiği en fazla ilan (4 Kasım verisiyle ölçüldü)
sweep_max_pages_per_band: 10
# laptop_node: "123456789"      # boş bırak: ürün sayfalarının kategori yolundan otomatik öğrenilir

# Tarama davranışı
kesif: true                     # false: yeni ürün aranmaz, yalnızca veritabanındakilerin fiyatı kontrol edilir
request_delay_sec: [8, 20]
max_detail_fetch_per_run: 25
mac_interval_min: 60            # Mac'te turlar arası süre (dakika)
human_wait_min: 15              # doğrulama çıktığında kullanıcıyı bekleme süresi (dakika)
pending_recheck_hours: 24
